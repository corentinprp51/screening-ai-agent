{% for message in messages %}
<div class="flex {{ 'justify-end' if message.role == 'candidate' else 'justify-start' }}">
  <p class="max-w-[80%] rounded-2xl px-3 py-2 whitespace-pre-line
            {{ 'bg-emerald-600 text-white' if message.role == 'candidate' else 'bg-slate-100' }}">{{ message.content }}</p>
</div>
{% endfor %}
