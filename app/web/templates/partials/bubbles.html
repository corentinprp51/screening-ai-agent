{% for message in messages %}
<div class="row {{ message.role }} pop" data-role="{{ message.role }}"{% if message.id %} data-id="{{ message.id }}"{% endif %}>
  <div class="bubble">
    <span class="whitespace-pre-line">{{ message.content }}</span>
    <span class="meta">
      <time{% if message.created_at %} datetime="{{ message.created_at.isoformat() }}">{{ message.created_at.strftime("%H:%M") }}{% else %}>{% endif %}</time>
      {% if message.role == "candidate" %}<span class="ticks read">✓✓</span>{% endif %}
    </span>
  </div>
</div>
{% endfor %}
