{% extends "base.html" %}
{% block title %}Apply{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Delivery driver application</h1>
<form method="post" action="/chat" class="bg-white rounded-lg shadow p-4 space-y-3">
  {% if error %}<p class="text-red-600 text-sm">{{ error }}</p>{% endif %}
  <label class="block">
    <span class="text-sm text-slate-600">Phone number</span>
    <input name="phone" required class="mt-1 w-full border rounded px-3 py-2" placeholder="+34 600 111 222">
  </label>
  <label class="block">
    <span class="text-sm text-slate-600">Name (optional)</span>
    <input name="name" class="mt-1 w-full border rounded px-3 py-2">
  </label>
  <button class="bg-emerald-600 text-white rounded px-4 py-2">Apply</button>
</form>
{% endblock %}
