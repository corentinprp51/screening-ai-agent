<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Candidate Screening{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(6px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }
    @keyframes typing-dot {
      0%, 60%, 100% { opacity: 0.3; transform: none; }
      30% { opacity: 1; transform: translateY(-3px); }
    }
    .pop { animation: pop-in 0.18s ease-out; }
    .typing-dot { animation: typing-dot 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
    @media (prefers-reduced-motion: reduce) {
      .pop, .typing-dot { animation: none; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <main class="{% block main_class %}{% block width %}max-w-xl{% endblock %} mx-auto p-4{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
