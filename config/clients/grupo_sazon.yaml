persona:
  agent_name: Lucía
  client_name: Grupo Sazón

default_language: es

# Asked in this order after consent. A knock-out field proposes a rejection on a "no".
fields:
  - type: name
  - type: license
    knock_out: true
  - type: own_vehicle
    knock_out: true
  - type: service_area
    knock_out: true
  - type: availability
  - type: schedule
  - type: experience
  - type: start_date

# A recruiter replies to a proposed rejection within this delay.
review_delay_hours: 24

# A recruiter calls a qualified candidate within this delay.
call_within_hours: 48

# An answer understood with less confidence than this is confirmed with the candidate.
confidence_threshold: 0.7

# Where the client hires: country → city → zones (districts or nearby towns, may be empty).
# The city is what the knock-out checks; a zone only helps find the city.
service_areas:
  ES:
    Madrid: [Centro, Chamberí, Salamanca, Tetuán, Getafe, Móstoles, Alcobendas]
    Barcelona: [Eixample, Gràcia, Sants, L'Hospitalet]
    Valencia: [Ruzafa, Benimaclet]
    Sevilla: [Triana, Nervión]
  MX:
    Ciudad de México: [Centro, Coyoacán, Polanco, Roma, Condesa, Iztapalapa]
    Guadalajara: [Centro, Zapopan, Tlaquepaque]
    Monterrey: [San Nicolás, Guadalupe]

# Known delivery platforms: an experience platform is mapped to one of them, anything else to "other".
platforms: [Glovo, Uber Eats, Just Eat, Rappi, Didi Food]

# A silent candidate gets a nudge at each delay after their last unanswered question
# (templates.nudges). At the deadline the screening ends: Abandoned, Qualified to review
# when only the recap is unconfirmed, or erased when the greeting was never answered.
nudge_delays_hours: [1, 20, 48]
deadline_hours: 72

# The priority score (0-100) ranks the queue. Weights: the most points per field, adding up to 100.
scoring:
  weights:
    availability: 30 # overlaps the open shifts' availability
    schedule: 20 # in the open shifts, or flexible
    start_date: 30 # full up to 7 days, then down to 0 at 90 days
    experience: 20 # min(years, 5) / 5 of the weight
  open_shifts:
    availability: [full_time, weekends]
    schedule: [evening]

templates:
  greeting:
    es: >-
      ¡Hola! Soy {agent_name}, asistente virtual de selección de {client_name} 👋
      Te escribo por tu candidatura de repartidor/a: son 2 minutos y un reclutador revisa cada perfil.
      ¿Seguimos?
    en: >-
      Hi! I'm {agent_name}, the virtual hiring assistant for {client_name} 👋
      I'm writing about your delivery driver application: it takes 2 minutes and a recruiter reviews every profile.
      Shall we start?
  # Sent when an LLM call fails; the next message gets the same question again.
  fallback:
    es: Perdona, he tenido un problema técnico. ¿Me lo puedes repetir?
    en: Sorry, I had a technical problem. Could you say that again?
  # Sent to any message received once the screening has stopped.
  after_close:
    es: Gracias por tu mensaje, un reclutador lo revisará.
    en: Thanks for your message, a recruiter will review it.
  # One per nudge delay, in order. {name} is ", <first name>" (empty while unknown);
  # {questions_left} counts the open fields and the recap.
  nudges:
    es:
      - "¿Seguimos{name}? Ya casi está, preguntas pendientes: {questions_left}."
      - "¿Retomamos{name}? Tu candidatura sigue abierta, preguntas pendientes: {questions_left}."
      - "Último recordatorio{name}: ¿terminamos tu candidatura? Preguntas pendientes: {questions_left}."
    en:
      - "Shall we carry on{name}? Almost done, questions left: {questions_left}."
      - "Shall we pick up where we left off{name}? Your application is still open, questions left: {questions_left}."
      - "Last reminder{name}: shall we finish your application? Questions left: {questions_left}."
