[project]
name = "screening-ai-agent"
version = "0.1.0"
description = "A screening AI Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Use a precise type (e.g. pydantic.JsonValue for JSON data), not Any."

[tool.ruff.lint.per-file-ignores]
# `Any` is banned in app/ only.
"!app/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
