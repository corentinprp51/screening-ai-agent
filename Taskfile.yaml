version: "3"

tasks:
  dev:install:
    desc: Install dependencies with uv
    cmds:
      - uv sync

  dev:run:
    desc: Run the web app with auto-reload (chat at http://localhost:8000/chat, dashboard at /dashboard)
    cmds:
      - uv run uvicorn app.api.main:app --reload
    dotenv: [.env]

  dev:cli:
    desc: Run a screening in the terminal
    interactive: true
    cmds:
      - uv run python -m app.cli
    dotenv: [.env]

  dev:reset:
    desc: Delete every candidate, message, event and consent drop-off, for a demo from an empty dashboard
    cmds:
      - uv run python -m app.reset
    dotenv: [.env]

  dev:test:
    desc: Run the tests (extra pytest args after --, e.g. task dev:test -- tests/domain)
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  dev:smoke:
    desc: Run scripted candidate messages against the real LLM (LLM_MODEL and OPENAI_API_KEY in .env)
    cmds:
      - uv run python -m evals.smoke
    dotenv: [.env]

  dev:evals:
    desc: Run the eval personas against the real LLM and write samples/conversations (persona keys after --, e.g. task dev:evals -- silent)
    cmds:
      - uv run python -m evals.runner {{.CLI_ARGS}}
    dotenv: [.env]

  dev:format:
    desc: Format code with ruff
    cmds:
      - uv run ruff format .

  dev:lint:
    desc: Lint code with ruff
    cmds:
      - uv run ruff check .

  dev:lint:fix:
    desc: Lint code with ruff and apply safe fixes
    cmds:
      - uv run ruff check --fix .

  container:up:
    desc: Build and start the app in a container with podman compose (http://localhost:8000/chat)
    cmds:
      - podman compose up --build --detach

  container:down:
    desc: Stop the container; the database stays in its volume
    cmds:
      - podman compose down

  container:reset:
    desc: Stop the container and delete its database volume (after a schema change)
    cmds:
      - podman compose down --volumes
